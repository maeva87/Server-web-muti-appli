upstream nodeapp_cluster {
    server nodeapp1:3000;
    server nodeapp2:3000;
    server nodeapp3:3000;
}

server {
    listen 80;
    server_name nodeapp.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nodeapp.local;

    ssl_certificate     /etc/nginx/certs/nodeapp.crt;
    ssl_certificate_key /etc/nginx/certs/nodeapp.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass http://nodeapp_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
